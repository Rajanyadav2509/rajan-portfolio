<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Admin | Rajan Yadav</title><link rel="icon" href="/images/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b1730;--gold:#d9b04a;--gg:linear-gradient(135deg,#f3d98a,#d9b04a 50%,#b8862b);--bg:#f1f4f9;--card:#fff;--ink:#17223b;--mut:#66728c;--line:#e3e8f1;--blue:#2f6bff;--grn:#1fa971;--red:#d6453d;--sh:0 1px 2px #0b17300d,0 8px 24px #0b173010}
[data-t=dark]{--bg:#0a1122;--card:#111b33;--ink:#e8edf9;--mut:#93a1c2;--line:#1f2c4b;--sh:0 8px 28px #0006}
*{box-sizing:border-box}body{margin:0;font:15px/1.55 "DM Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);transition:background .3s}
h1,h2,h3{font-family:"Bricolage Grotesque",sans-serif;margin:0;letter-spacing:-.02em}[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:.55rem 1rem;font-weight:700;background:var(--card);border:1px solid var(--line);transition:transform .15s,box-shadow .2s,background .2s}
button:hover{transform:translateY(-1px);box-shadow:var(--sh)}.pri{background:var(--gg);color:var(--navy);border-color:transparent}.dan{color:var(--red)}
input,select,textarea{width:100%;padding:.65rem .85rem;border:1px solid var(--line);border-radius:10px;background:var(--card)}input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
a{color:inherit}.mut{color:var(--mut)}.sm{font-size:.85rem}
#login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}.lv{background:radial-gradient(circle at 20% 20%,#1d3a78,#060e22 65%);color:#fff;display:grid;place-content:center;gap:1.2rem;padding:3rem;position:relative;overflow:hidden}
.lv::before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:#b8862b;filter:blur(110px);opacity:.35;bottom:-120px;left:-100px;animation:dr 12s ease-in-out infinite alternate}@keyframes dr{to{transform:translate(80px,-50px)}}
.lv img{width:150px;position:relative}.lv h2{font-size:2.2rem;position:relative}.lv p{color:#b9c6e6;margin:0;position:relative;max-width:26em}
.lf{display:grid;place-content:center;padding:2rem}.box{width:min(360px,100%);display:grid;gap:1rem}.err{color:var(--red);min-height:1.3em;margin:0}
#app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.sb{background:var(--navy);color:#cbd5ee;padding:1.2rem .9rem;display:flex;flex-direction:column;gap:.3rem;position:sticky;top:0;height:100vh}
.br{display:flex;gap:.7rem;align-items:center;padding:.3rem .5rem 1.2rem;color:#fff}.br img{width:42px}.br b{font:800 1.05rem "Bricolage Grotesque"}.br small{display:block;color:#8fa2cc;font-size:.75rem}
.sb button{background:none;border:0;color:inherit;text-align:left;display:flex;align-items:center;gap:.7rem;padding:.7rem .8rem;border-radius:12px;width:100%;font-weight:500}.sb button:hover{background:#ffffff12;transform:none;box-shadow:none}
.sb button.on{background:#ffffff1c;color:#fff;box-shadow:inset 3px 0 0 var(--gold)}.pill{margin-left:auto;background:var(--gold);color:var(--navy);border-radius:999px;font-size:.75rem;padding:0 .55rem;font-weight:700}
.sp{flex:1}.main{padding:1.4rem 1.8rem;min-width:0}.top{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap;margin-bottom:1.3rem}.top h1{font-size:1.7rem;flex:1}.top input{width:240px}.bur{display:none}
.g{display:grid;gap:1rem}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1.6fr 1fr}.c{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:1.1rem 1.2rem;box-shadow:var(--sh);animation:up .5s both}@keyframes up{from{opacity:0;transform:translateY(12px)}}
.k{position:relative;overflow:hidden}.k small{color:var(--mut);font-weight:500}.k b{display:block;font:800 2rem "Bricolage Grotesque";line-height:1.2}.k i{position:absolute;right:-8px;top:-8px;width:64px;height:64px;border-radius:50%;opacity:.14;background:var(--gold)}
.k.b i{background:var(--blue)}.k.g1 i{background:var(--grn)}.k.r i{background:var(--red)}
.rng{display:inline-flex;gap:.3rem}.rng button{padding:.25rem .7rem;font-size:.85rem}.rng .on{background:var(--navy);color:#fff}
.chart{position:relative;margin-top:.6rem}.chart svg{width:100%;height:auto;display:block}.tip{position:absolute;pointer-events:none;background:var(--navy);color:#fff;font-size:.8rem;padding:.35rem .6rem;border-radius:8px;transform:translate(-50%,-110%);white-space:nowrap;opacity:0;transition:opacity .15s}
.row{display:flex;align-items:center;gap:.6rem}.bar{height:8px;border-radius:8px;background:var(--line);flex:1;overflow:hidden}.bar i{display:block;height:100%;background:var(--gg);border-radius:8px}
.av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:.9rem}
.ml{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:1rem;align-items:start}.fl{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.8rem}.fl button{padding:.3rem .8rem;font-size:.85rem}.fl .on{background:var(--navy);color:#fff}
.li{display:flex;gap:.7rem;align-items:center;padding:.75rem .6rem;border-radius:14px;cursor:pointer;border:1px solid transparent}.li:hover{background:var(--bg)}.li.sel{background:var(--bg);border-color:var(--gold)}.li.un strong{font-weight:800}.li.un::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--gold);flex:none}
.li .t{flex:1;min-width:0}.li p{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mut);font-size:.88rem}.st{background:none;border:0;padding:0 .2rem;font-size:1.15rem;color:#b9c2d6}.st.on{color:var(--gold)}
.tag{display:inline-block;border-radius:999px;padding:.05rem .65rem;font-size:.75rem;font-weight:700;background:#2f6bff1f;color:var(--blue)}.s-in_progress{background:#d9b04a30;color:#a67c12}.s-replied{background:#1fa9711f;color:var(--grn)}.s-closed{background:#66728c26;color:var(--mut)}
.det h2{font-size:1.4rem}.msg{white-space:pre-wrap;background:var(--bg);border-radius:14px;padding:1rem;margin:1rem 0}.acts{display:flex;gap:.5rem;flex-wrap:wrap;margin:1rem 0}.acts a{text-decoration:none}
.stp{display:flex;gap:.4rem;flex-wrap:wrap}.stp button.on{background:var(--navy);color:#fff}
.bulk{display:flex;gap:.5rem;align-items:center;background:var(--navy);color:#fff;border-radius:12px;padding:.5rem .8rem;margin-bottom:.8rem;flex-wrap:wrap}.bulk button{padding:.25rem .7rem;font-size:.82rem}
.sw{display:flex;gap:.8rem;align-items:center;cursor:pointer}.sw input{width:44px;height:24px;appearance:none;background:var(--line);border-radius:99px;position:relative;cursor:pointer;padding:0;transition:.2s}.sw input::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}.sw input:checked{background:var(--grn)}.sw input:checked::after{left:23px}
.fm{display:grid;gap:.8rem;max-width:560px}.fm label{display:grid;gap:.25rem;font-weight:700;font-size:.9rem}.empty{text-align:center;color:var(--mut);padding:2.5rem 1rem}
#toasts{position:fixed;right:18px;bottom:18px;display:grid;gap:.5rem;z-index:99}.ts{background:var(--navy);color:#fff;padding:.7rem 1rem;border-radius:12px;box-shadow:var(--sh);animation:up .3s both;border-left:4px solid var(--gold)}
.sk{height:60px;border-radius:14px;background:linear-gradient(90deg,var(--line),var(--bg),var(--line));background-size:200% 100%;animation:sh 1.2s infinite;margin-bottom:.5rem}@keyframes sh{to{background-position:-200% 0}}
@media(max-width:1000px){.g4{grid-template-columns:1fr 1fr}.g2,.ml{grid-template-columns:1fr}}
@media(max-width:760px){#login{grid-template-columns:1fr}.lv{display:none}#app{grid-template-columns:1fr}.sb{position:fixed;z-index:50;width:250px;transform:translateX(-100%);transition:transform .3s}.sb.open{transform:none}.bur{display:block}.main{padding:1rem}.top input{width:100%}.g4{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<main id="login"><div class="lv"><img src="/images/logo-512.png" alt=""><h2>Welcome back, Rajan.</h2><p>Your leads, visitors and site settings in one place.</p></div>
<div class="lf"><form class="box" id="lf"><h1>Admin sign in</h1><label>Username<input id="u" autocomplete="username" required></label><label>Password<input id="p" type="password" autocomplete="current-password" required></label><p class="err" id="le" role="alert"></p><button class="pri">Sign in</button></form></div></main>
<div id="app" hidden><aside class="sb" id="sb"><div class="br"><img src="/images/logo-192.png" alt=""><div><b>Rajan Yadav</b><small>Admin dashboard</small></div></div>
<button data-v="dash">&#9638; Dashboard</button><button data-v="msgs">&#9993; Messages <span class="pill" id="unp" hidden></span></button><button data-v="set">&#9881; Settings</button><div class="sp"></div>
<button id="vs">&#8599; View website</button><button id="out">&#8629; Sign out</button></aside>
<div class="main"><div class="top"><button class="bur" id="bur" aria-label="Menu">&#9776;</button><h1 id="ttl">Dashboard</h1><input id="q" placeholder="Search messages..." aria-label="Search"><button id="th" title="Toggle dark mode">&#9680;</button><button id="rf" title="Refresh">&#8635;</button></div>
<section id="v-dash"></section><section id="v-msgs" hidden></section><section id="v-set" hidden></section></div></div><div id="toasts"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let T=sessionStorage.getItem('t'),USER=sessionStorage.getItem('u')||'admin',ALL=[],ST=null,SET=null,RANGE=30,VIEW='dash',FILT='all',SVC='',SEL=new Set(),CUR=null;
const SL={new:'New',in_progress:'In progress',replied:'Replied',closed:'Closed'};
document.documentElement.dataset.t=localStorage.getItem('adm-t')||'light';
function toast(m){const d=document.createElement('div');d.className='ts';d.textContent=m;$('#toasts').appendChild(d);setTimeout(()=>d.remove(),2800)}
async function api(p,o={}){const r=await fetch('/api/admin/'+p,{...o,headers:{'Content-Type':'application/json',Authorization:'Bearer '+T}});if(r.status===401){signout();throw 0}return r}
const J=(p,m,b)=>api(p,{method:m,body:JSON.stringify(b)}).then(r=>r.json());
function signout(){if(T)fetch('/api/admin/logout',{method:'POST',headers:{Authorization:'Bearer '+T}}).catch(()=>{});sessionStorage.clear();T=null;$('#app').hidden=true;$('#login').style.display='grid'}
const ago=d=>{const s=(Date.now()-new Date(d))/1e3;if(s<60)return 'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';if(s<604800)return Math.floor(s/86400)+'d ago';return new Date(d).toLocaleDateString()};
const col=n=>`hsl(${[...n].reduce((a,c)=>a+c.charCodeAt(0),0)*37%360} 55% 45%)`,ini=n=>n.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const av=n=>`<span class="av" style="background:${col(n)}">${esc(ini(n))}</span>`;
function count(el){const n=+el.dataset.n,t0=performance.now();(function f(t){const p=Math.min((t-t0)/900,1);el.textContent=Math.round(n*(1-Math.pow(1-p,3))).toLocaleString();if(p<1)requestAnimationFrame(f)})(t0)}
async function load(){const[m,s,g]=await Promise.all([api('messages').then(r=>r.json()),api('stats?days='+RANGE).then(r=>r.json()),api('settings').then(r=>r.json())]);ALL=m.messages.map(x=>({status:'new',starred:false,note:'',...x}));ST=s;SET=g.settings;
 $('#login').style.display='none';$('#app').hidden=false;const u=ALL.filter(x=>!x.read).length;$('#unp').hidden=!u;$('#unp').textContent=u;document.title=(u?`(${u}) `:'')+'Admin | Rajan Yadav';route()}
function line(ser,keys,cols){const W=700,H=220,P=28,mx=Math.max(4,...ser.flatMap(d=>keys.map(k=>d[k]))),x=i=>P+i*(W-2*P)/(ser.length-1),y=v=>H-P-v/mx*(H-2*P);
 const path=k=>ser.map((d,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(d[k]).toFixed(1)).join(' ');
 return `<svg viewBox="0 0 ${W} ${H}" data-ser='${JSON.stringify(ser.map(d=>[d.d,...keys.map(k=>d[k])]))}' data-keys="${keys}"><defs>${cols.map((c,i)=>`<linearGradient id="gr${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".35"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient>`).join('')}</defs>
 ${[0,.5,1].map(f=>`<line x1="${P}" x2="${W-P}" y1="${H-P-f*(H-2*P)}" y2="${H-P-f*(H-2*P)}" stroke="var(--line)"/><text x="2" y="${H-P-f*(H-2*P)+4}" font-size="11" fill="var(--mut)">${Math.round(mx*f)}</text>`).join('')}
 ${keys.map((k,i)=>`<path d="${path(k)} L${x(ser.length-1)} ${H-P} L${P} ${H-P}Z" fill="url(#gr${i})"/><path d="${path(k)}" fill="none" stroke="${cols[i]}" stroke-width="2.5" stroke-linejoin="round"/>`).join('')}
 <text x="${P}" y="${H-6}" font-size="11" fill="var(--mut)">${ser[0].d.slice(5)}</text><text x="${W-P}" y="${H-6}" font-size="11" text-anchor="end" fill="var(--mut)">${ser.at(-1).d.slice(5)}</text></svg><div class="tip"></div>`}
function donut(o,cs=['#2f6bff','#d9b04a','#1fa971','#d6453d','#8a5cf6']){const e=Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,5),t=e.reduce((a,b)=>a+b[1],0);if(!t)return '<p class="empty">No data yet</p>';let off=0;
 return `<div class="row"><svg viewBox="0 0 42 42" width="120" height="120"><circle cx="21" cy="21" r="15.9" fill="none" stroke="var(--line)" stroke-width="6"/>${e.map(([k,v],i)=>{const p=v/t*100,s=`<circle cx="21" cy="21" r="15.9" fill="none" stroke="${cs[i]}" stroke-width="6" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${25-off}"/>`;off+=p;return s}).join('')}</svg>
 <div style="flex:1">${e.map(([k,v],i)=>`<div class="sm"><span style="color:${cs[i]}">&#9679;</span> ${esc(k)} <b>${v}</b></div>`).join('')}</div></div>`}
function kpi(l,v,c=''){return `<div class="c k ${c}"><i></i><small>${l}</small><b data-n="${v}">0</b></div>`}
function bars(o){const e=Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,6),m=e[0]?.[1]||1;return e.length?e.map(([k,v])=>`<div class="row sm" style="margin:.4rem 0"><span style="width:110px;overflow:hidden;text-overflow:ellipsis">${esc(k)}</span><div class="bar"><i style="width:${v/m*100}%"></i></div><b>${v}</b></div>`).join(''):'<p class="empty">No data yet</p>'}
function dash(){const s=ST.series,sum=k=>s.reduce((a,d)=>a+d[k],0),wk=ALL.filter(m=>Date.now()-new Date(m.createdAt)<6048e5).length,done=ALL.filter(m=>['replied','closed'].includes(m.status)).length,hr=new Date().getHours(),sv={};ALL.forEach(m=>sv[m.service||'Other']=(sv[m.service||'Other']||0)+1);
 const pipe=Object.keys(SL).map(k=>`<div class="row sm" style="margin:.4rem 0"><span class="tag s-${k}" style="width:110px;text-align:center;white-space:nowrap">${SL[k]}</span><div class="bar"><i style="width:${ALL.length?ALL.filter(m=>m.status===k).length/ALL.length*100:0}%"></i></div><b>${ALL.filter(m=>m.status===k).length}</b></div>`).join('');
 $('#v-dash').innerHTML=`<p class="mut" style="margin:-.6rem 0 1rem">Good ${hr<12?"morning":hr<17?"afternoon":"evening"}, ${esc(USER[0].toUpperCase()+USER.slice(1))}. Here is how your site is doing.</p>
 <div class="g g4">${kpi('Total messages',ALL.length)}${kpi('Unread',ALL.filter(m=>!m.read).length,'r')}${kpi('Messages this week',wk,'b')}${kpi('Replied or closed',done,'g1')}</div>
 <div class="g g4" style="margin-top:1rem">${kpi('Page views',sum('view'),'b')}${kpi('Visitors (sessions)',sum('visit'))}${kpi('WhatsApp clicks',sum('wa'),'g1')}${kpi('Resume downloads',sum('resume'))}</div>
 <div class="g g2" style="margin-top:1rem"><div class="c"><div class="row"><h3 style="flex:1">Traffic</h3><span class="rng">${[7,30,90].map(n=>`<button data-r="${n}" class="${n==RANGE?'on':''}">${n}d</button>`).join('')}</span></div><div class="chart">${line(s,['view','visit'],['#2f6bff','#d9b04a'])}</div><p class="sm mut"><span style="color:#2f6bff">&#9679;</span> Page views &nbsp;<span style="color:#d9b04a">&#9679;</span> Visitors</p></div>
 <div class="c"><h3>Leads by service</h3><div style="margin-top:.8rem">${donut(sv)}</div><h3 style="margin-top:1.2rem">Lead pipeline</h3>${pipe}</div></div>
 <div class="g g2" style="margin-top:1rem"><div class="c"><h3>Recent messages</h3>${ALL.slice(0,5).map(m=>`<div class="li" data-open="${m.id}">${av(m.name)}<div class="t"><strong>${esc(m.name)}</strong> <span class="tag s-${m.status}">${SL[m.status]}</span><p>${esc(m.message)}</p></div><span class="sm mut">${ago(m.createdAt)}</span></div>`).join('')||'<p class="empty">No messages yet. Enquiries from your contact form appear here.</p>'}</div>
 <div class="c"><h3>Where visitors come from</h3>${bars(ST.refs)}<h3 style="margin-top:1.2rem">Devices</h3>${donut(ST.devices)}</div></div>`;
 $$('#v-dash [data-n]').forEach(count)}
const filt=()=>{const q=$('#q').value.toLowerCase();return ALL.filter(m=>(FILT==='all'||(FILT==='unread'?!m.read:FILT==='starred'?m.starred:m.status===FILT))&&(!SVC||m.service===SVC)&&(!q||JSON.stringify(m).toLowerCase().includes(q)))};
function msgs(){const rows=filt(),svcs=[...new Set(ALL.map(m=>m.service).filter(Boolean))];const m=ALL.find(x=>x.id===CUR);
 $('#v-msgs').innerHTML=`<div class="ml"><div class="c"><div class="fl">${['all','unread','starred',...Object.keys(SL)].map(f=>`<button data-f="${f}" class="${f===FILT?'on':''}">${SL[f]||f[0].toUpperCase()+f.slice(1)}</button>`).join('')}</div>
 <select id="sv" style="margin-bottom:.8rem"><option value="">All services</option>${svcs.map(s=>`<option ${s===SVC?'selected':''}>${esc(s)}</option>`).join('')}</select>
 ${SEL.size?`<div class="bulk"><b>${SEL.size} selected</b><button data-b="read">Mark read</button><button data-b="unread">Mark unread</button><button data-b="star">Star</button><button data-b="delete" class="dan">Delete</button></div>`:''}
 ${rows.map(x=>`<div class="li ${x.read?'':'un'} ${x.id===CUR?'sel':''}" data-open="${x.id}"><input type="checkbox" style="width:auto" data-c="${x.id}" ${SEL.has(x.id)?'checked':''} aria-label="Select">${av(x.name)}<div class="t"><strong>${esc(x.name)}</strong> <span class="sm mut">${ago(x.createdAt)}</span><p>${esc(x.message)}</p></div><button class="st ${x.starred?'on':''}" data-s="${x.id}" aria-label="Star">&#9733;</button></div>`).join('')||'<p class="empty">No messages match.</p>'}</div>
 <div class="c det">${m?detail(m):'<p class="empty">Select a message to read, reply and add notes.</p>'}</div></div>`}
function detail(m){const ph=(m.phone||'').replace(/\D/g,''),wa=ph?(ph.length===10?'91'+ph:ph):'';
 return `<div class="row">${av(m.name)}<div style="flex:1"><h2>${esc(m.name)}</h2><span class="sm mut">${new Date(m.createdAt).toLocaleString()} ${m.service?'&middot; '+esc(m.service):''}</span></div><button class="st ${m.starred?'on':''}" data-s="${m.id}">&#9733;</button></div>
 <p class="sm" style="margin:.8rem 0 0"><a href="mailto:${esc(m.email)}">${esc(m.email)}</a>${m.phone?' &middot; '+esc(m.phone):''}</p><div class="msg">${esc(m.message)}</div>
 <div class="acts"><a href="mailto:${esc(m.email)}?subject=Re: your enquiry"><button class="pri" data-st="replied" data-id="${m.id}">Reply by email</button></a>${wa?`<a href="https://wa.me/${wa}" target="_blank" rel="noopener"><button data-st="replied" data-id="${m.id}">Reply on WhatsApp</button></a>`:''}<button data-cp="${esc(m.email)}">Copy email</button><button data-rd="${m.id}">Mark ${m.read?'unread':'read'}</button><button class="dan" data-del="${m.id}">Delete</button></div>
 <h3 style="font-size:1rem">Status</h3><div class="stp" style="margin:.5rem 0 1rem">${Object.entries(SL).map(([k,v])=>`<button data-st="${k}" data-id="${m.id}" class="${m.status===k?'on':''}">${v}</button>`).join('')}</div>
 <h3 style="font-size:1rem">Private notes</h3><textarea id="nt" rows="4" placeholder="Budget, follow-up date, ideas..." data-id="${m.id}">${esc(m.note)}</textarea>`}
function sett(){const s=SET,b=s.banner;$('#v-set').innerHTML=`<div class="g g2"><div class="c"><h3>Availability badge</h3><p class="mut sm">Controls the badge on your homepage hero.</p><div class="fm"><label class="sw"><input type="checkbox" id="av" ${s.available?'checked':''}> Available for new projects</label><label>Text when available<input id="at" value="${esc(s.availableText)}" maxlength="80"></label><label>Text when booked<input id="ut" value="${esc(s.unavailableText)}" maxlength="80"></label></div></div>
 <div class="c"><h3>Announcement bar</h3><p class="mut sm">A slim bar at the top of your website (offers, launches, holidays).</p><div class="fm"><label class="sw"><input type="checkbox" id="bo" ${b.on?'checked':''}> Show announcement</label><label>Message<input id="bt" value="${esc(b.text)}" maxlength="200"></label><label>Link (optional, https:// or #section)<input id="bl" value="${esc(b.link)}"></label><label>Link text<input id="bk" value="${esc(b.linkText)}" maxlength="40"></label></div></div></div>
 <p><button class="pri" id="ss">Save settings</button></p>
 <div class="c" style="margin-top:1rem"><h3>Data and backups</h3><p class="mut sm">Download your messages, analytics and settings any time.</p><div class="acts"><button id="csv">Messages (CSV)</button><button id="jsn">Full backup (JSON)</button></div></div>
 <div class="c" style="margin-top:1rem"><h3>Account</h3><p class="mut sm">Signed in as <b>${esc(USER)}</b>. Sessions last 8 hours. To change the username or password, edit <code>ADMIN_USER</code> and <code>ADMIN_PASSWORD</code> in your <code>.env</code> file and restart the server.</p></div>`}
function route(){const t={dash:'Dashboard',msgs:'Messages',set:'Settings'};VIEW=t[VIEW]?VIEW:'dash';$('#ttl').textContent=t[VIEW];$$('.sb [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===VIEW));
 ['dash','msgs','set'].forEach(v=>$('#v-'+v).hidden=v!==VIEW);$('#q').hidden=VIEW!=='msgs';({dash,msgs,set:sett}[VIEW])()}
const go=v=>{VIEW=v;$('#sb').classList.remove('open');route()};
async function patch(id,b){await J('messages/'+id,'PATCH',b);Object.assign(ALL.find(x=>x.id===id),b)}
async function bulk(action,value){await J('messages/bulk','POST',{ids:[...SEL],action,value});if(action==='delete')SEL.clear();await load();toast('Done')}
document.addEventListener('click',async e=>{const t=e.target,B=s=>t.closest(s);let x;
 if(x=B('[data-v]'))return go(x.dataset.v);
 if(x=B('[data-r]')){RANGE=+x.dataset.r;ST=await api('stats?days='+RANGE).then(r=>r.json());return dash()}
 if(x=B('[data-s]')){e.stopPropagation();const m=ALL.find(y=>y.id===x.dataset.s);await patch(m.id,{starred:!m.starred});return route()}
 if(x=B('[data-c]'))return x.checked?SEL.add(x.dataset.c):SEL.delete(x.dataset.c),msgs();
 if(x=B('[data-f]')){FILT=x.dataset.f;return msgs()}
 if(x=B('[data-b]')){if(x.dataset.b==='delete'&&!confirm(`Delete ${SEL.size} message(s) permanently?`))return;return bulk(x.dataset.b)}
 if(x=B('[data-st]')){await patch(x.dataset.id,{status:x.dataset.st,read:true});if(x.tagName==='BUTTON'&&!x.closest('a'))route();return}
 if(x=B('[data-rd]')){const m=ALL.find(y=>y.id===x.dataset.rd);await patch(m.id,{read:!m.read});return load()}
 if(x=B('[data-del]')){if(!confirm('Delete this message permanently?'))return;await J('messages/bulk','POST',{ids:[x.dataset.del],action:'delete'});CUR=null;await load();return toast('Message deleted')}
 if(x=B('[data-cp]')){navigator.clipboard?.writeText(x.dataset.cp);return toast('Email copied')}
 if(x=B('[data-open]')){CUR=x.dataset.open;const m=ALL.find(y=>y.id===CUR);if(m&&!m.read)patch(CUR,{read:true}).then(()=>{const u=ALL.filter(y=>!y.read).length;$('#unp').hidden=!u;$('#unp').textContent=u});VIEW='msgs';return route()}
 if(B('#ss')){const r=await J('settings','PUT',{available:$('#av').checked,availableText:$('#at').value,unavailableText:$('#ut').value,banner:{on:$('#bo').checked,text:$('#bt').value,link:$('#bl').value,linkText:$('#bk').value}});SET=r.settings;return toast('Settings saved. Live on your website.')}
 if(B('#csv')||B('#jsn')){const j=!!B('#jsn'),r=await api(j?'export.json':'export.csv'),a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download=j?'portfolio-backup.json':'messages.csv';a.click()}});
document.addEventListener('change',e=>{if(e.target.id==='sv'){SVC=e.target.value;msgs()}});
let nt;document.addEventListener('input',e=>{if(e.target.id==='nt'){clearTimeout(nt);nt=setTimeout(()=>patch(e.target.dataset.id,{note:e.target.value}).then(()=>toast('Note saved')),700)}});
document.addEventListener('mousemove',e=>{const sv=e.target.closest?.('.chart svg');if(!sv)return;const r=sv.getBoundingClientRect(),d=JSON.parse(sv.dataset.ser),i=Math.max(0,Math.min(d.length-1,Math.round(((e.clientX-r.left)/r.width*700-28)/644*(d.length-1)))),tp=sv.nextElementSibling;tp.style.left=(28+i*644/(d.length-1))/700*r.width+'px';tp.style.top='30px';tp.style.opacity=1;tp.textContent=`${d[i][0]}: ${d[i][1]} views, ${d[i][2]} visitors`});
document.addEventListener('mouseout',e=>{if(e.target.closest?.('.chart'))$$('.tip').forEach(t=>t.style.opacity=0)});
$('#q').oninput=msgs;$('#out').onclick=signout;$('#vs').onclick=()=>open('/','_blank');$('#bur').onclick=()=>$('#sb').classList.toggle('open');$('#rf').onclick=()=>load().then(()=>toast('Refreshed'));
$('#th').onclick=()=>{const d=document.documentElement.dataset.t==='dark'?'light':'dark';document.documentElement.dataset.t=d;localStorage.setItem('adm-t',d)};
$('#lf').onsubmit=async e=>{e.preventDefault();$('#le').textContent='';const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#u').value,password:$('#p').value})}),d=await r.json();
 if(!d.ok){$('#le').textContent=d.error;return}T=d.token;USER=d.username;sessionStorage.setItem('t',T);sessionStorage.setItem('u',USER);load()};
setInterval(()=>{if(T&&!document.hidden)api('messages').then(r=>r.json()).then(d=>{if(d.messages.length>ALL.length){toast('New message received');load()}}).catch(()=>{})},45000);
if(T)load().catch(()=>{});
</script></body></html>
