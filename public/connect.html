<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connect with Rajan Yadav | Social Media Manager</title>
<meta name="description" content="Send Rajan Yadav a message about LinkedIn growth, personal branding or YouTube SEO. He replies within one working day.">
<link rel="icon" href="/images/logo-96.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
/* Connect page: only the form, on the same deep-blue countdown starfield */
html,body{min-height:100%}
body{background:radial-gradient(ellipse at 50% 0%,#0a1e42 0%,#061230 45%,#020617 100%);color:var(--tx);font-family:"DM Sans",system-ui,sans-serif;display:grid;place-items:center;padding:1.2rem;position:relative;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(70px);pointer-events:none;z-index:0}
body::before{width:560px;height:560px;left:50%;top:-180px;margin-left:-280px;background:radial-gradient(circle,#3b82f633,transparent 65%);animation:cdFloat1 9s ease-in-out infinite}
body::after{width:480px;height:480px;right:-140px;bottom:-160px;background:radial-gradient(circle,#0ea5e955,transparent 65%);animation:cdFloat2 11s ease-in-out infinite}
.connect-wrap{position:relative;z-index:1;width:min(560px,100%);text-align:center}
.connect-logo{width:72px;height:72px;border-radius:50%;box-shadow:0 0 0 2px #22c55e44,0 10px 30px #00000080;margin-bottom:.9rem}
.connect-wrap h1{margin:0 0 .3rem;font:800 1.7rem "Bricolage Grotesque";color:#fff;letter-spacing:-.01em}
.connect-wrap .connect-sub{margin:0 0 1.4rem;color:#7dd3fc;font-weight:700;font-size:.8rem;letter-spacing:.22em;text-transform:uppercase}
.connect-wrap .form{text-align:left}
.connect-back{display:inline-block;margin-top:1.1rem;color:#7dd3fc;font-weight:700;text-decoration:none}
.connect-back:hover{text-decoration:underline}
/* Thank-you card: the welcome-card animation */
#thanks{display:none}
#thanks.show{display:block;animation:splashIn .7s var(--ease) both}
#thanks .splash-card{max-width:560px;width:100%;padding:2.6rem 2rem 2.2rem}
#thanks.closing .splash-card{animation:paperClose .9s cubic-bezier(.5,.05,.3,1) forwards}
#thanks .tick{width:74px;height:74px;margin:0 auto 1rem;border-radius:50%;display:grid;place-items:center;font-size:2.2rem;color:#052e16;background:linear-gradient(135deg,#4ade80,#22c55e);box-shadow:0 0 0 6px #22c55e22,0 0 40px #22c55e55}
#thanks h2{margin:0 0 .5rem;font:800 1.6rem "Bricolage Grotesque";color:#fff}
#thanks p{margin:0 0 1.4rem;color:#c4cde4;line-height:1.6}
@media(max-width:520px){.connect-wrap h1{font-size:1.4rem}.form{grid-template-columns:1fr!important}}
@media(prefers-reduced-motion:reduce){body::before,body::after{animation:none}#thanks.show{animation:none}}
</style></head>
<body>
<div class="cd-stars" aria-hidden="true"><span style="left:6%;top:14%;--s:3px;--d:0s"></span><span style="left:12%;top:38%;--s:2px;--d:.8s"></span><span style="left:18%;top:8%;--s:4px;--d:1.5s"></span><span style="left:24%;top:52%;--s:2px;--d:.4s"></span><span style="left:30%;top:22%;--s:3px;--d:2s"></span><span style="left:36%;top:64%;--s:2px;--d:1.1s"></span><span style="left:42%;top:10%;--s:4px;--d:.2s"></span><span style="left:48%;top:30%;--s:2px;--d:1.7s"></span><span style="left:54%;top:48%;--s:3px;--d:.9s"></span><span style="left:60%;top:16%;--s:2px;--d:1.3s"></span><span style="left:66%;top:58%;--s:4px;--d:.6s"></span><span style="left:72%;top:26%;--s:3px;--d:1.9s"></span><span style="left:78%;top:44%;--s:2px;--d:.3s"></span><span style="left:84%;top:12%;--s:4px;--d:1.4s"></span><span style="left:90%;top:34%;--s:3px;--d:.7s"></span><span style="left:95%;top:56%;--s:2px;--d:1.8s"></span><span style="left:8%;top:68%;--s:2px;--d:1s"></span><span style="left:94%;top:72%;--s:3px;--d:.5s"></span></div><div class="cd-bokeh" aria-hidden="true"><span style="left:10%;top:62%;--s:26px;--d:0s"></span><span style="left:20%;top:76%;--s:16px;--d:1.2s"></span><span style="left:32%;top:58%;--s:34px;--d:.6s"></span><span style="left:44%;top:72%;--s:18px;--d:1.8s"></span><span style="left:56%;top:60%;--s:28px;--d:.3s"></span><span style="left:68%;top:74%;--s:15px;--d:2.1s"></span><span style="left:80%;top:62%;--s:24px;--d:.9s"></span><span style="left:90%;top:70%;--s:17px;--d:1.5s"></span></div><div class="cd-blueglow" aria-hidden="true"></div><div class="cd-beam" aria-hidden="true"></div><div class="cd-frame" aria-hidden="true"></div>
<main class="connect-wrap">
<a href="/" aria-label="Back to Rajan Yadav portfolio"><img class="connect-logo" src="/images/logo-192.png" srcset="/images/logo-192.png 1x,/images/logo-512.png 2x" alt="Rajan Yadav logo" width="72" height="72"></a>
<div id="formBox">
<h1>Let&rsquo;s talk</h1>
<p class="connect-sub">Social Media Manager Portfolio</p>
<form id="cf" class="form" novalidate><p class="form-sub">I reply within one working day.</p><label>Name<input name="name" required autocomplete="name" maxlength="80" placeholder="Your name"></label><label>Email<input name="email" type="email" required autocomplete="email" maxlength="120" placeholder="you@email.com"></label>
<label>Phone (optional)<input name="phone" type="tel" autocomplete="tel" maxlength="30" placeholder="Optional"></label>
<label>I need help with<select name="service"><option>LinkedIn content and management</option><option>Carousel design</option><option>YouTube SEO packs</option><option>Personal branding</option><option>Newsletter and Substack</option><option>Something else</option></select></label>
<label class="full">Message<textarea name="message" rows="4" required minlength="10" maxlength="2000" placeholder="Tell me about your LinkedIn or YouTube goals&hellip;"></textarea></label>
<input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
<button class="btn gold" id="send" style="grid-column:1/-1">Send message</button><p id="fs" role="status" aria-live="polite" style="grid-column:1/-1"></p></form>
<a class="connect-back" href="/">&larr; Back to portfolio</a>
</div>
<div id="thanks" role="status" aria-live="polite"><div class="splash-card"><div class="tick" aria-hidden="true">&#10003;</div><h2>Thank you!</h2><p>Your message is sent. I will reply within one working day.<br>Talk soon!</p><p style="margin-top:-.6rem;font-size:.9rem;color:#7dd3fc">Returning to the home page in a few seconds&hellip;</p><a class="btn gold" href="/">Back to portfolio</a></div></div>
</main>
<script src="/js/connect.js"></script>
</body></html>
